media:
  input: media
  output: media

content:
  - name: news
    label: Новости
    type: file
    path: content/news.json
    format: json
    list: true
    fields:
      - { name: date, label: Дата, type: date }
      - { name: tag, label: Метка (например Объект, Событие, Обучение), type: string }
      - { name: title, label: Заголовок, type: string }
      - { name: text, label: Текст, type: text }
      - { name: image, label: Фото (необязательно), type: image }
      - { name: link, label: Ссылка, например на пост в Instagram (необязательно), type: string }

  - name: gallery
    label: Фото объектов
    type: file
    path: content/gallery.json
    format: json
    list: true
    fields:
      - { name: image, label: Фото, type: image }
      - { name: caption, label: Подпись, type: string }

  - name: equipment
    label: Спецтехника
    type: file
    path: content/equipment.json
    format: json
    list: true
    fields:
      - { name: name, label: Название машины, type: string }
      - { name: photo, label: Фото, type: image }
      - { name: text, label: Для чего используется, type: text }
      - { name: example, label: Пометка «Пример» (снимите, когда данные точные), type: boolean }
      - name: specs
        label: Характеристики
        type: object
        list: true
        fields:
          - { name: label, label: Параметр (например Глубина бурения), type: string }
          - { name: value, label: Значение (например до 100 м), type: string }

  - name: team
    label: Руководство
    type: file
    path: content/team.json
    format: json
    list: true
    fields:
      - { name: name, label: Имя и фамилия, type: string }
      - { name: role, label: Должность, type: string }
      - { name: text, label: Коротко о человеке (необязательно), type: text }
      - { name: photo, label: Фото (лучше вертикальное), type: image }

  - name: awards
    label: Достижения
    type: file
    path: content/awards.json
    format: json
    list: true
    fields:
      - { name: title, label: Название (грамота, сертификат, награда), type: string }
      - { name: year, label: Год, type: string }
      - { name: image, label: Фото или скан, type: image }

  - name: services
    label: Услуги
    type: file
    path: content/services.json
    format: json
    list: true
    fields:
      - { name: title, label: Название, type: string }
      - { name: text, label: Описание, type: text }
      - { name: items, label: Пункты списка, type: string, list: true }

  - name: settings
    label: Контакты и соцсети
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: phone, label: Телефон, type: string }
      - { name: whatsapp, label: Номер WhatsApp, type: string }
      - { name: address, label: Адрес офиса (метку на карте меняет разработчик), type: string }
      - { name: instagram, label: Instagram (ссылка), type: string }
      - { name: telegram, label: Telegram (ссылка), type: string }
      - { name: facebook, label: Facebook (ссылка), type: string }
      - { name: linkedin, label: LinkedIn (ссылка), type: string }
